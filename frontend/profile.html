<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Campus Connect</title>
    <style>
        /* CSS STYLES */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .profile-card {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            box-sizing: border-box;
        }
        h1 {
            margin-top: 0;
            color: #333;
            font-size: 24px;
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }
        .info-group {
            margin-bottom: 15px;
        }
        .info-group label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .info-group p {
            margin: 0;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 6px;
            color: #333;
        }
        .edit-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            display: none; 
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-edit {
            background-color: #007bff;
            color: white;
        }
        .btn-edit:hover { background-color: #0056b3; }
        
        .btn-save {
            background-color: #28a745;
            color: white;
            display: none; 
        }
        .btn-save:hover { background-color: #218838; }
        
        .loading {
            text-align: center;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="profile-card" id="profileCard">
        <h1>Student Profile</h1>
        <div id="loadingMessage" class="loading">Loading profile data...</div>
        
        <div id="profileContent" style="display: none;">
            <div class="info-group">
                <label>First Name</label>
                <p id="displayFirstName"></p>
                <input type="text" id="inputFirstName" class="edit-input">
            </div>
            <div class="info-group">
                <label>Last Name</label>
                <p id="displayLastName"></p>
                <input type="text" id="inputLastName" class="edit-input">
            </div>
            <div class="info-group">
                <label>Major</label>
                <p id="displayMajor"></p>
                <input type="text" id="inputMajor" class="edit-input">
            </div>
            <div class="info-group">
                <label>Graduation Year</label>
                <p id="displayGraduationYear"></p>
                <input type="number" id="inputGraduationYear" class="edit-input">
            </div>
            <div class="info-group">
                <label>Bio</label>
                <p id="displayBio"></p>
                <input type="text" id="inputBio" class="edit-input">
            </div>

            <div class="button-group">
                <button class="btn-edit" id="editBtn" onclick="enableEditMode()">Edit Profile</button>
                <button class="btn-save" id="saveBtn" onclick="saveProfile()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // JAVASCRIPT LOGIC
        const PROFILE_ID = 1; 
        const API_URL = "http://localhost:8080/api/profiles/" + PROFILE_ID;
        const MOCK_TOKEN = "campus-connect-secret"; // The token required by our backend

        // 1. Fetch the data when the page loads
        window.onload = function() {
            fetchProfile();
        };

        function fetchProfile() {
            fetch(API_URL, {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + MOCK_TOKEN, // Send the token
                    'Content-Type': 'application/json'
                }
            })
                .then(response => {
                    if (!response.ok) throw new Error("Profile not found");
                    return response.json();
                })
                .then(data => {
                    document.getElementById('loadingMessage').style.display = 'none';
                    document.getElementById('profileContent').style.display = 'block';

                    document.getElementById('displayFirstName').innerText = data.firstName || 'N/A';
                    document.getElementById('displayLastName').innerText = data.lastName || 'N/A';
                    document.getElementById('displayMajor').innerText = data.major || 'N/A';
                    document.getElementById('displayGraduationYear').innerText = data.graduationYear || 'N/A';
                    document.getElementById('displayBio').innerText = data.bio || 'N/A';
                })
                .catch(error => {
                    document.getElementById('loadingMessage').innerText = "Error loading profile. Did you create it in Postman?";
                    console.error(error);
                });
        }

        // 2. Switch to Edit Mode
        function enableEditMode() {
            document.querySelectorAll('p').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.edit-input').forEach(el => el.style.display = 'block');
            
            document.getElementById('inputFirstName').value = document.getElementById('displayFirstName').innerText;
            document.getElementById('inputLastName').value = document.getElementById('displayLastName').innerText;
            document.getElementById('inputMajor').value = document.getElementById('displayMajor').innerText;
            document.getElementById('inputGraduationYear').value = document.getElementById('displayGraduationYear').innerText;
            document.getElementById('inputBio').value = document.getElementById('displayBio').innerText;

            document.getElementById('editBtn').style.display = 'none';
            document.getElementById('saveBtn').style.display = 'block';
        }

        // 3. Save the data back to the API (WITH VALIDATION)
        function saveProfile() {
            // --- VALIDATION START ---
            const firstNameInput = document.getElementById('inputFirstName').value.trim();
            const lastNameInput = document.getElementById('inputLastName').value.trim();
            const gradYearInput = document.getElementById('inputGraduationYear').value;

            if (!firstNameInput || !lastNameInput) {
                alert("First Name and Last Name cannot be empty!");
                return; // Stop the function here so it doesn't save
            }

            if (gradYearInput.length !== 4 || isNaN(gradYearInput)) {
                alert("Please enter a valid 4-digit Graduation Year.");
                return; // Stop the function here
            }
            // --- VALIDATION END ---

            const updatedData = {
                firstName: firstNameInput,
                lastName: lastNameInput,
                major: document.getElementById('inputMajor').value,
                graduationYear: parseInt(gradYearInput),
                bio: document.getElementById('inputBio').value,
                cognitoUserId: "cognito-test-123" 
            };

            fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + MOCK_TOKEN, // Send the token
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatedData)
            })
            .then(response => response.json())
            .then(data => {
                document.querySelectorAll('p').forEach(el => el.style.display = 'block');
                document.querySelectorAll('.edit-input').forEach(el => el.style.display = 'none');
                document.getElementById('editBtn').style.display = 'block';
                document.getElementById('saveBtn').style.display = 'none';
                
                fetchProfile(); 
                alert("Profile saved successfully!");
            })
            .catch(error => {
                alert("Error saving profile.");
                console.error(error);
            });
        }
    </script>
</body>
</html>
