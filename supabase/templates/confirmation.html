<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your CampusConnect email</title>
  </head>
  <body style="margin: 0; padding: 24px; background-color: #f6f7fb; color: #222; font-family: Arial, sans-serif;">
    <div style="max-width: 480px; margin: 0 auto; padding: 24px; background-color: #fff; border-radius: 8px;">
      <h1 style="margin: 0 0 16px; font-size: 24px;">Verify your CampusConnect email</h1>
      <p>Enter this verification code in CampusConnect to confirm your university email address:</p>
      <p style="margin: 24px 0; font-size: 32px; font-weight: bold; letter-spacing: 4px;">{{ .Token }}</p>
      <p>This code can only be used once. If it expires, request a new code in CampusConnect.</p>
      <p style="margin-top: 24px; color: #666; font-size: 14px;">If you did not sign up for CampusConnect, you can ignore this email.</p>
    </div>
  </body>
</html>
